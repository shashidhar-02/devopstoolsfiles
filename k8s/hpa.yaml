apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-hpa
  spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
# Notes:
# HPA.yaml
# Purpose of HPA (automatic scaling based on metrics)
# Metrics types (CPU, memory, custom)
# HPA configuration (minReplicas, maxReplicas, target metrics)
# Advanced Topics
# Custom metrics and external metrics

