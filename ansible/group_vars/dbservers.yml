---
# group_vars/dbservers.yml
# Variables specific to database servers

# Database configuration
db_engine: mysql
db_version: "8.0"
db_port: 3306
db_name: "production_db"
db_user: "app_user"
db_password: "{{ vault_db_password }}"  # From vault

# MySQL/MariaDB specific settings
mysql_max_connections: 200
mysql_innodb_buffer_pool_size: "2G"
mysql_query_cache_size: "64M"

# Backup configuration
db_backup_enabled: true
db_backup_path: "/backup/mysql"
db_backup_retention: 14  # days

# Replication settings (conditional)
replication_enabled: "{{ true if inventory_hostname == 'db01.example.com' else false }}"
replication_master: "db01.example.com"

# Performance tuning
slow_query_log: true
slow_query_time: 2

# Security
db_bind_address: "0.0.0.0"
db_firewall_rules:
  - { port: 3306, source: "10.0.1.0/24" }  # Allow from webservers
