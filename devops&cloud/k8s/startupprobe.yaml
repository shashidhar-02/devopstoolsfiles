apiVersion: v1 
kind:  Pod
metadata:
  name: startup-probe-pod
spec:
  automountServiceAccountToken: false
  containers:
  - name: startup-probe-container
    image: my-image:1.0.0
    ports:
    - containerPort: 80
    startupProbe:
      httpGet:
        path: / 
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 256Mi
        cpu: 200m
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5  
      periodSeconds: 10
