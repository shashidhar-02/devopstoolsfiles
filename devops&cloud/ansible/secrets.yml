---
# Secret Management Example with Ansible Vault
# To encrypt this file: ansible-vault encrypt secrets.yml
# To edit: ansible-vault edit secrets.yml
# To decrypt: ansible-vault decrypt secrets.yml

# Database passwords (these should be encrypted)
vault_db_password: "SuperSecretPassword123!"
vault_db_root_password: "RootPassword456!"

# API Keys
vault_api_key: "your-api-key-here"
vault_secret_key: "your-secret-key-here"

# SSL Certificate passwords
vault_ssl_key_password: "ssl-cert-password"

# AWS Credentials (for dynamic inventory)
vault_aws_access_key: "AKIAIOSFODNN7EXAMPLE"
vault_aws_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

# SSH Keys
vault_ssh_private_key: |
  -----BEGIN RSA PRIVATE KEY-----
  [Your encrypted private key content]
  -----END RSA PRIVATE KEY-----

# Application secrets
vault_jwt_secret: "your-jwt-secret-key"
vault_session_secret: "your-session-secret"

# Third-party service credentials
vault_sendgrid_api_key: "SG.xxxxx"
vault_stripe_api_key: "sk_test_xxxxx"

# To use in playbooks:
# {{ vault_db_password }}

# Encryption command:
# ansible-vault encrypt secrets.yml --vault-password-file .vault_pass
# 
# Usage in playbook:
# ansible-playbook site.yml --vault-password-file .vault_pass
