# Ansible Configuration File
# Production-grade settings with SSH optimizations

[defaults]
# Inventory
inventory = ./inventory
host_key_checking = False

# Roles path
roles_path = ./roles

# SSH Optimizations (as mentioned in topics)
timeout = 30
forks = 20
strategy = free  # Parallel execution

# Pipelining for performance
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r

# Logging
log_path = ./ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# Facts caching for performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Error handling
retry_files_enabled = True
retry_files_save_path = ./retry

# Callbacks for better output
stdout_callback = yaml
bin_ansible_callbacks = True

# Vault settings (secret management)
vault_password_file = ./.vault_pass
# Create: echo "your-vault-password" > .vault_pass && chmod 600 .vault_pass

# Playbook optimization
hash_behaviour = merge
command_warnings = True
deprecation_warnings = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH optimizations for production
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
pipelining = True
transfer_method = smart

# Connection persistence
retries = 3
